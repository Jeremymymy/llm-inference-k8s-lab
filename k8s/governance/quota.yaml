# ============================================================================
# ResourceQuota + LimitRange —— on-prem 的資源治理
# ============================================================================
# on-prem 的核心政治問題是「這幾張 GPU 怎麼分給三個團隊」。
# 雲端可以再開一台，地端不行 —— 容量是固定的，所以配額是硬需求。
# 這是 on-prem 平台工程師的日常，也是跟雲原生職缺差最多的地方之一。
# ============================================================================
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: pricer-quota
  namespace: pricer
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.memory: 24Gi
    # GPU 只能用 requests 限制（extended resource 的 requests 必須等於 limits）。
    # Phase 0.5 先用假的 example.com/gpu 練，Phase 3 換成 nvidia.com/gpu。
    requests.example.com/gpu: "2"
    persistentvolumeclaims: "4"
    count/deployments.apps: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: pricer-defaults
  namespace: pricer
spec:
  limits:
    - type: Container
      # 沒寫 requests 的容器會拿到這些預設值。
      # 為什麼重要：一旦 namespace 有 ResourceQuota，「沒寫 requests 的 pod
      # 會直接被拒絕」。LimitRange 幫大家補上預設值，
      # 否則每個人都要在每個 manifest 裡寫一遍。
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      default:
        memory: 512Mi
      max:
        memory: 12Gi       # 防止單一 pod 把整個配額吃光
