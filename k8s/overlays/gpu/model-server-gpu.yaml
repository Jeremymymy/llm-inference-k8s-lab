# GPU overlay：把 llama.cpp (CPU) 換成 vLLM (GPU)。
# 用 strategic merge patch —— container 依 name 合併，所以只要寫要改的欄位。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-server
spec:
  template:
    spec:
      # ------------------------------------------------------------------
      # GPU 節點必須「兩個都設」：
      #   toleration  → 讓這個 pod 被允許進入有 taint 的 GPU 節點
      #   nodeSelector → 讓這個 pod 只想去 GPU 節點
      # 只設 toleration：GPU pod 可能被排到 CPU 節點上然後失敗
      # 只設 nodeSelector：一般 pod 也會被排進昂貴的 GPU 節點
      # ------------------------------------------------------------------
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        nvidia.com/gpu.present: "true"

      # ⚠️ k3s 的預設 runtime 是 runc。不指定這個的話，pod 拿得到 nvidia.com/gpu
      # （排程成功），但容器裡看不到卡 —— vLLM 會在啟動時找不到 CUDA 而 crash。
      # 「nvidia」這個 RuntimeClass 是 k3s 偵測到 NVIDIA Container Toolkit 後自動建的。
      runtimeClassName: nvidia

      initContainers:
        # vLLM 直接從 HF Hub 拉權重（有 HF cache 的 PVC 撐著），
        # 不需要 Phase 0 那個下載 GGUF 的 initContainer。
        # 這裡只留一個「確認 adapter 在位」的檢查 —— 理由同 Phase 0：
        # 開不起來的錯誤，好過安靜答錯的錯誤。
        - name: fetch-base-model
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              set -eu
              if [ ! -d /models/adapter ]; then
                echo "錯誤：/models/adapter 不存在。" >&2
                echo "請先把 LoRA adapter 放進 PVC（見 docs/06 Part 3）。" >&2
                exit 1
              fi
              echo "adapter 就緒："; ls -lh /models/adapter/

      containers:
        - name: llama-server          # 名字沿用 base 的，才能被 strategic merge 命中
          image: vllm/vllm-openai:latest
          args:
            - --model
            - meta-llama/Llama-3.2-3B
            - --served-model-name
            - base
            - --enable-lora
            - --lora-modules
            # ⚠️ 容器內的路徑。找不到的話 vLLM 啟動就失敗（LoRAAdapterNotFoundError）
            - pricer=/models/adapter
            # ⚠️ adapter 是 r=256，預設值 16。不設的話 vLLM 啟動就拒絕載入 adapter
            - --max-lora-rank
            - "256"
            # 一道防線：超長請求直接拒絕。預設 131072 在 L4 上連啟動都不行（見 docs/05 Part 3）
            - --max-model-len
            - "512"
            # ⚠️ time-slicing 時要除以同卡上的 pod 數，而且每一份都要放得下權重 + 開銷（見 docs/06 Part 7.2）
            - --gpu-memory-utilization
            - "0.85"
            # 聽 base 的 8080（vLLM 預設 8000）。不另外宣告 8000：strategic merge 會留下 base 的
            # 8080 port，兩個都叫 http 會撞名。放最後，docs/06 Part 7 的 args/12 索引才不會變
            - --port
            - "8080"

          env:
            # base 以 uid 10001 跑，vLLM image 的 HOME 是 /root（不可寫）；
            # torch.compile / Triton 的快取都寫 ~/.cache，指到可寫的 /tmp
            - name: HOME
              value: /tmp
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            - name: HF_HOME
              value: /models/hf

          # vLLM 的啟動比 llama.cpp 慢很多：載權重 + 編 CUDA graph。
          # 這個數字要用 Phase 1 實際量到的冷啟動時間 × 2 以上。
          # 90 × 10 = 900 秒。
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 90

          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            failureThreshold: 5

          resources:
            # g6.xlarge 只有 4 vCPU / 約 15 GiB 可分配。requests 只影響排程：
            # 要讓 time-slicing 的 2～3 個 pod 排得上（docs/06 Part 7），瓶頸才會落在顯存而不是 CPU/記憶體。
            # Phase 2 實測 vLLM 約用 1.1 顆核心。
            requests:
              cpu: 500m
              memory: 4Gi
              # extended resource 的規則：只能是整數、requests 必須等於 limits、
              # 不可超賣。這跟 CPU 完全不同。
              nvidia.com/gpu: "1"
            limits:
              memory: 12Gi
              nvidia.com/gpu: "1"
