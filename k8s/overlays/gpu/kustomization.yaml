apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Phase 3：同一份 base，只換這一層。
# base 裡沒有任何 GPU 相關設定 —— overlay 只做「加法」，
# 這樣本機（沒有 GPU）跟 GPU 機器可以共用同一份 base。

images:
  - name: pricer-api
    newTag: dev
  # 鎖成 Phase 1/2 實測用的那一版（vLLM 0.31.0，見 RESULTS.md），數字才可比
  - name: vllm/vllm-openai
    digest: sha256:c1c9f6fd5c109ba7f0546a59f5b2f15fb87f64c77782e90a27b648b42a8e67c3

patches:
  - path: model-server-gpu.yaml
    target:
      kind: Deployment
      name: model-server
