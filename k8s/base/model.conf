# ============================================================================
# 模型座標的唯一真實來源 (single source of truth)
# ============================================================================
# 格式是 KEY=value（值不加引號，因為 ConfigMap 會把引號當成值的一部分）。
# 不要用 `set -a; . model.conf` 去 source：有空白的值（PROMPT_*）會被 bash 拆壞。
# 在 shell 裡這樣載入：
#   while IFS='=' read -r k v; do export "$k=$v"; done < <(grep -E '^[A-Z_]+=' k8s/base/model.conf)
# 也用 `kubectl create configmap model-config --from-env-file=k8s/base/model.conf`
# 直接變成 k8s ConfigMap。
#
# 所有文件、腳本、manifest 都從這裡取值。
# 之後你自己跑完 week7 的 fine-tune，只要改 ADAPTER_REPO / ADAPTER_REVISION，
# 整套 lab 就會切換到你自己的模型 —— 不需要改任何其他檔案。
#
# 這個檔「不含任何祕密」，會進 git。HF token 之類的放 private/（已 gitignore）。
#
# 為什麼它住在 k8s/base/ 而不是 config/：
#   Kustomize 的 load restrictor 不准 kustomization 讀取自己目錄以外的檔案
#   （這是為了讓一份 kustomization 可以被安全地遠端引用）。
#   繞過它要加 --load-restrictor LoadRestrictionsNone，那是個會傳染的壞習慣。
#   讓設定檔住在 base 裡是零成本的正解。
# ============================================================================

# --- 基礎模型 ---------------------------------------------------------------
# 注意：是 base model 不是 Instruct。沒有 chat template，
# 推論一律走 /v1/completions，不是 /v1/chat/completions。
# 這是 HuggingFace 上的 gated repo，第一次用要先到網頁接受 Llama 3.2 授權。
BASE_MODEL=meta-llama/Llama-3.2-3B

# --- LoRA adapter -----------------------------------------------------------
# 目前用的是 Ed Donner 課程提供的 adapter（見 README 的 Attribution）。
ADAPTER_REPO=ed-donner/price-2025-11-28_18.47.07
ADAPTER_REVISION=b19c8bfea3b6ff62237fbb0a8da9779fc12cefbd

# adapter 的 LoRA 超參數（來源：該 repo 的 adapter_config.json，不要憑記憶填）
# r=256 很重要：vLLM 的 --max-lora-rank 預設是 16，
# 不改的話會「安靜地」截斷載入 —— 服務正常起來，但答案是錯的。
LORA_RANK=256
LORA_ALPHA=512

# --- 評估資料集 -------------------------------------------------------------
# items_prompts_* 的欄位是 {prompt, completion}，splits 為 train / val / test。
# full 的 test split 有 10,000 筆，lite 有 1,000 筆。
DATASET_PROMPTS=ed-donner/items_prompts_full
DATASET_ITEMS=ed-donner/items_full

# --- Prompt 模板（必須與訓練時逐字相同）--------------------------------------
# 完整格式：{PROMPT_QUESTION}\n\n{summary}\n\n{PROMPT_PREFIX}
# 注意 PROMPT_PREFIX 結尾的 "$" 後面「沒有」空白。差一個字元，數值就不會對。
PROMPT_QUESTION=What does this cost to the nearest dollar?
PROMPT_PREFIX=Price is $

# --- 推論參數（對齊訓練與原始 Modal 服務的黃金基準）-------------------------
# greedy decoding，只生 5 個 token（價格永遠是 "<整數>.00" 的形式）
MAX_TOKENS=5
TEMPERATURE=0
# prompt 約 150 tokens + 輸出 5 tokens。模型預設 context 是 131072，
# 不調小的話 KV cache 會被浪費掉 99% 以上。這是本 workload 最大的效能槓桿，
# 也是單張 GPU 能跑多個 replica 的前提。
MAX_MODEL_LEN=512

# --- 驗收門檻（來源：課程 week7/results.ipynb 的 leaderboard）----------------
# 你的服務跑 test split 應該落在 TARGET_MAE 附近。
# 偏差必須能用「量化路徑不同」解釋；不能解釋就是有 bug，不要放過。
TARGET_MAE_FULL=39.85
TARGET_MAE_LITE=65.40
BASELINE_MAE_BASE_MODEL=110.72
BASELINE_MAE_XGBOOST=68.23
BASELINE_MAE_CONSTANT=106.18
